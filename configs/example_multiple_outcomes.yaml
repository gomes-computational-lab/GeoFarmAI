sources:
  - id: soil
    path: ../data/example_soil.csv
    coordinates: {x: x, y: y, crs: EPSG:32615}
    variables:
      EC: {role: predictor, domain: soil}
      moisture: {role: predictor, domain: soil}
  - id: outcomes
    path: ../data/example_outcomes.csv
    coordinates: {x: x, y: y, crs: EPSG:32615}
    variables:
      yield: {role: outcome, domain: crop}
      nitrate: {role: outcome, domain: nutrient}

analysis:
  harmonization: {strategy: auto, resolution: auto}
  decomposition: {method: pca, n_components: 2}
  clustering:
    methods: [kmeans]
    k: {min: 2, max: 3}
  selection: {metric: variance_reduction, outcome: nitrate}
  random_state: 42
