project:
  name: synthetic_field
  crs_in: EPSG:4326
  auto_reproject_to_utm: true
  soil:
    path: ../examples/data/soil_sample.csv
    x: Longitude
    y: Latitude
    id_column: null
    variables: [Slope, EC_DP, Moisture]
    required_variables: [Slope, Moisture, EC_DP]
  yield:
    path: ../examples/data/yield_sample.csv
    x: Longitude
    y: Latitude
    id_column: null
    column: Yield
  yield_column: yield

grid:
  min_cell_size_m: 3
  max_cell_size_m: 30
  target_points_per_cell: 1.2
  method: idw
  buffer_m: 15
  kriging_variogram: spherical
  kriging_nlags: 12

weights:
  k: 4

spatial_pca:
  engine: multispaeti
  use_r_multispati: false
  n_components: 2

clustering:
  algorithms: [kmeans, agglomerative, gmm, fcm]
  k_values: [2, 3]
  seeds: [42, 1337]

raster:
  enabled: false
  cache: true
  target_crs: auto_utm
  cell_size: null
  buffer: 0.0
  ref_index: 0
  silhouette_sample_size: 20000
  parallel_gridsearch: false
  n_jobs: 1
  use_pca: true
  pca_variables: [Slope, EC_DP, Moisture]
  kriging:
    variogram_model: spherical
    nlags: 12
    weight: false
    n_closest_points: 12

postprocess:
  min_area_m2: 0

export:
  basemap: none
  out_dir: ../outputs

experiments:
  - name: synthetic_feature_test
    overrides:
      clustering:
        algorithms: [kmeans]
        k_values: [2]
        seeds: [42]
    parameters:
      spatial_pca.n_components: [2]
