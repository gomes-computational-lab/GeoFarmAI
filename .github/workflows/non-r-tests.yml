name: Non-R tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GeoFarmAI without R support
        run: python -m pip install -e ".[dev]"
      - name: Verify rpy2 was not installed
        run: python -c "import importlib.util; assert importlib.util.find_spec('rpy2') is None"
      - name: Run non-R tests
        run: python -m pytest -q -m "not r"
