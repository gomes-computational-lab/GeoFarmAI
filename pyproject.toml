[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geofarmai"
version = "0.1.0"
description = "A geospatial AI framework for farmer-centered sustainable agricultural zone management"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-UNLICENSED"
license-files = ["LICENSE", "LICENSE-TODO.md"]
authors = [{ name = "AUTHOR LIST REQUIRES HUMAN REVIEW" }]
keywords = ["agriculture", "geospatial", "management-zones", "clustering", "PCA"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
  "geopandas>=0.14,<2",
  "pyproj>=3.6,<4",
  "shapely>=2,<3",
  "rasterio>=1.3,<2",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "scikit-fuzzy>=0.4,<1",
  "statsmodels>=0.14,<1",
  "libpysal>=4.10,<5",
  "esda>=2.5,<3",
  "pykrige>=1.7,<2",
  "contextily>=1.6,<2",
]

[project.optional-dependencies]
multispati = ["multispaeti"]
r = ["rpy2>=3.5,<4"]
parallel = []
docs = ["mkdocs>=1.6,<2", "mkdocstrings[python]>=0.25,<1"]
dev = ["pytest>=7.4,<9", "build>=1.2,<2"]

[project.scripts]
geofarmai = "geofarmai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geofarmai = ["resources/*.qml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "slow: long-running analysis",
  "gis: geospatial integration test",
  "r: requires R, rpy2, and R spatial packages",
]
