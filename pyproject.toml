[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geofarmai"
version = "0.1.0"
description = "Geospatial scientific workflows for agricultural management-zone delineation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Papia Rozario"},
    {name = "Rahul Gomes"},
    {name = "Patricia Leigh Cabañes Alegria"},
]
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy>=1.11,<1.16",
    "geopandas==0.14.4",
    "pyproj==3.6.1",
    "shapely==2.0.4",
    "scikit-learn==1.4.2",
    "scikit-fuzzy==0.4.2",
    "statsmodels==0.14.2",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
multispati = ["multispaeti"]
spatial = [
    "libpysal==4.10",
    "esda",
]
r = [
    "rpy2==3.5.16",
    "libpysal==4.10",
    "esda",
]
raster = [
    "rasterio==1.3.10",
    "pykrige",
    "matplotlib==3.8.4",
    "contextily==1.6.0",
]
dev = [
    "pytest>=7.4,<9",
    "build>=1,<2",
]

[project.scripts]
geofarmai = "geofarmai.cli:main"

[project.urls]
Repository = "https://github.com/gomes-computational-lab/GeoFarmAI"

[tool.setuptools.packages.find]
where = ["."]
include = ["geofarmai*", "core*"]
namespaces = true
