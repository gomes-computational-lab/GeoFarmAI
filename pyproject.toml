[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geofarmai"
version = "0.1.0"
description = "Geospatial scientific workflows for agricultural management-zone delineation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "geopandas==0.14.4",
    "pyproj==3.6.1",
    "shapely==2.0.4",
    "libpysal==4.10",
    "esda",
    "scikit-gstat==1.1.12",
    "rasterio==1.3.10",
    "mapclassify==2.6.1",
    "contextily==1.6.0",
    "matplotlib==3.8.4",
    "pykrige",
    "tifffile",
    "multispaeti",
    "scikit-learn==1.4.2",
    "scikit-fuzzy==0.4.2",
    "statsmodels==0.14.2",
    "pydantic==2.7.1",
    "pyyaml==6.0.1",
    "prefect==2.19.9",
]

[project.optional-dependencies]
r = ["rpy2==3.5.16"]
dev = ["pytest>=7.4,<9"]
legacy-application = [
    "langchain==0.1.17",
    "langchain-community==0.0.36",
    "tabulate==0.9.0",
    "great-expectations==0.18.13",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "jinja2==3.1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["geofarmai*", "core*", "jobs*", "services*"]
namespaces = true
